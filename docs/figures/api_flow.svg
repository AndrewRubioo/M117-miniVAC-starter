<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" font-weight="600" fill="#2C2C2A">MiniVAC API: what the server checks over HTTP</text>
  <text x="30" y="60" font-size="13" fill="#5F5E5A">Local FastAPI server at 127.0.0.1:8000. The server trusts only its own clock and rules, never client-claimed state.</text>

  <!-- Client container -->
  <rect x="30" y="78" width="250" height="312" rx="14" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="48" y="100" font-size="14" font-weight="600" fill="#444441">Client (untrusted)</text>

  <rect x="46" y="116" width="218" height="96" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="62" y="140" font-size="15" font-weight="600" fill="#4A1B0C">Player client</text>
  <text x="62" y="160" font-size="12" fill="#712B13">Sends move and shoot as JSON</text>
  <text x="62" y="184" font-size="12" fill="#712B13" font-family="Menlo, Consolas, monospace">{"player_id", "kind",</text>
  <text x="62" y="200" font-size="12" fill="#712B13" font-family="Menlo, Consolas, monospace"> "dx"}</text>

  <rect x="46" y="252" width="218" height="118" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="62" y="276" font-size="15" font-weight="600" fill="#4A1B0C">Client guard</text>
  <text x="62" y="296" font-size="12" fill="#712B13">Asset hash + plugin allowlist</text>
  <text x="62" y="322" font-size="12" fill="#A32D2D">No API endpoint: its report</text>
  <text x="62" y="338" font-size="12" fill="#A32D2D">never reaches the server, so</text>
  <text x="62" y="354" font-size="12" fill="#A32D2D">client attacks run in-process</text>

  <!-- HTTP arrows -->
  <line x1="264" y1="146" x2="374" y2="146" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="320" y="138" font-size="11" fill="#5F5E5A" text-anchor="middle">POST /action</text>
  <line x1="374" y1="186" x2="268" y2="186" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="320" y="204" font-size="11" fill="#5F5E5A" text-anchor="middle">JSON reply</text>
  <line x1="264" y1="311" x2="310" y2="311" stroke="#A32D2D" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="314" y1="304" x2="326" y2="318" stroke="#A32D2D" stroke-width="1.6"/>
  <line x1="326" y1="304" x2="314" y2="318" stroke="#A32D2D" stroke-width="1.6"/>

  <!-- Server container -->
  <rect x="360" y="78" width="570" height="312" rx="14" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="378" y="100" font-size="14" font-weight="600" fill="#444441">Server (trusted): checks run in order</text>

  <rect x="378" y="116" width="126" height="100" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="441" y="142" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle">Request shape</text>
  <text x="441" y="168" font-size="12" fill="#5F5E5A" text-anchor="middle">api.py model;</text>
  <text x="441" y="186" font-size="12" fill="#5F5E5A" text-anchor="middle">extra fields ignored</text>

  <rect x="514" y="116" width="126" height="100" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="577" y="142" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle">Action check</text>
  <text x="577" y="168" font-size="12" fill="#5F5E5A" text-anchor="middle">move or shoot only;</text>
  <text x="577" y="186" font-size="12" fill="#5F5E5A" text-anchor="middle">dx must be finite</text>

  <rect x="650" y="116" width="126" height="100" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="713" y="142" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle">Speed limit</text>
  <text x="713" y="168" font-size="12" fill="#5F5E5A" text-anchor="middle">|dx| ≤ 5 × elapsed</text>
  <text x="713" y="186" font-size="12" fill="#5F5E5A" text-anchor="middle">on the server clock</text>

  <rect x="786" y="116" width="126" height="100" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="849" y="142" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle">Fire cooldown</text>
  <text x="849" y="168" font-size="12" fill="#5F5E5A" text-anchor="middle">0.3 s since last</text>
  <text x="849" y="186" font-size="12" fill="#5F5E5A" text-anchor="middle">accepted shot</text>

  <line x1="504" y1="166" x2="511" y2="166" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="640" y1="166" x2="647" y2="166" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="776" y1="166" x2="783" y2="166" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#ar)"/>

  <rect x="378" y="256" width="262" height="114" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="394" y="282" font-size="15" font-weight="600" fill="#04342C">Every check passes</text>
  <text x="394" y="306" font-size="12" fill="#085041">Accepted: position or shot count</text>
  <text x="394" y="322" font-size="12" fill="#085041">updated, event logged.</text>
  <text x="394" y="348" font-size="12" fill="#085041">State readable at GET /state/{id}</text>

  <rect x="650" y="256" width="262" height="114" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/>
  <text x="666" y="282" font-size="15" font-weight="600" fill="#501313">Any check fails</text>
  <text x="666" y="306" font-size="12" fill="#791F1F">Rejected with a reason; state</text>
  <text x="666" y="322" font-size="12" fill="#791F1F">unchanged, event still logged.</text>
  <text x="666" y="348" font-size="12" fill="#791F1F">speed_violation, fire_rate_violation</text>

  <!-- Verified results -->
  <text x="30" y="424" font-size="14" font-weight="600" fill="#444441">Verified over HTTP</text>
  <text x="30" y="450" font-size="13" fill="#2C2C2A">Valid move (dx 0.2)</text>
  <text x="250" y="450" font-size="13" fill="#0F6E56">accepted</text>
  <text x="30" y="472" font-size="13" fill="#2C2C2A">Teleport (dx 20)</text>
  <text x="250" y="472" font-size="13" fill="#0F6E56">rejected: speed_violation</text>
  <text x="30" y="494" font-size="13" fill="#2C2C2A">Two immediate shots</text>
  <text x="250" y="494" font-size="13" fill="#0F6E56">2nd rejected: fire_rate_violation</text>
  <text x="500" y="450" font-size="13" fill="#2C2C2A">Extra "x": 999 claiming a position</text>
  <text x="760" y="450" font-size="13" fill="#0F6E56">ignored</text>
  <text x="500" y="472" font-size="13" fill="#2C2C2A">10 shots 0.31 s apart (CA13)</text>
  <text x="760" y="472" font-size="13" fill="#A32D2D">all 10 accepted</text>
  <line x1="30" y1="512" x2="930" y2="512" stroke="#D3D1C7" stroke-width="1"/>
  <text x="30" y="536" font-size="12" fill="#5F5E5A">Teal = server behaved as intended. Red = cheat got through: scripted input inside the limits passes every check. Toy model, not VAC.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
