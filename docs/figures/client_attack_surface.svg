<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" font-weight="600" fill="#2C2C2A">MiniVAC: where client attacks enter and what sees them</text>
  <text x="30" y="60" font-size="13" fill="#5F5E5A">Combined mode (client guard + server rules). 14 attack scenarios, 4 legitimate controls.</text>

  <rect x="30" y="76" width="590" height="446" rx="14" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="48" y="98" font-size="14" font-weight="600" fill="#444441">Client machine (untrusted, attacker controls)</text>
  <rect x="660" y="76" width="270" height="446" rx="14" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="678" y="98" font-size="14" font-weight="600" fill="#444441">Server (trusted)</text>

  <!-- Asset file -->
  <rect x="50" y="112" width="270" height="110" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="66" y="136" font-size="16" font-weight="600" fill="#4A1B0C">Asset file</text>
  <text x="66" y="156" font-size="13" fill="#712B13">Hashed by the guard</text>
  <text x="66" y="180" font-size="13" fill="#0F6E56">Caught: CA01, CA02, CA03</text>
  <text x="66" y="198" font-size="13" fill="#A32D2D">Missed: CA05 (revert before scan)</text>
  <text x="66" y="214" font-size="13" fill="#854F0B">False positive: CL03 (game update)</text>

  <!-- Loaded plugins -->
  <rect x="330" y="112" width="270" height="110" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="346" y="136" font-size="16" font-weight="600" fill="#4A1B0C">Loaded plugins</text>
  <text x="346" y="156" font-size="13" fill="#712B13">Names checked against allowlist</text>
  <text x="346" y="180" font-size="13" fill="#0F6E56">Caught: CA06, CA07, CA08</text>
  <text x="346" y="198" font-size="13" fill="#A32D2D">Missed: CA09 (spoof), CA10 (late load)</text>
  <text x="346" y="214" font-size="13" fill="#854F0B">False positive: CL04 (overlay)</text>

  <!-- Client guard -->
  <rect x="50" y="262" width="550" height="80" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="325" y="286" font-size="16" font-weight="600" fill="#4A1B0C" text-anchor="middle">Client guard (monitor)</text>
  <text x="325" y="306" font-size="13" fill="#712B13" text-anchor="middle">SHA-256 hash check + name allowlist, runs at scan time only</text>
  <text x="325" y="328" font-size="13" fill="#A32D2D" text-anchor="middle">Missed: CA11 (monitor output forged)</text>

  <!-- Reference data -->
  <rect x="50" y="382" width="270" height="110" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="66" y="406" font-size="16" font-weight="600" fill="#4A1B0C">Reference data</text>
  <text x="66" y="426" font-size="13" fill="#712B13">Expected hash and allowlist</text>
  <text x="66" y="450" font-size="13" fill="#A32D2D">Missed: CA04 (hash rewritten)</text>
  <text x="66" y="468" font-size="13" fill="#A32D2D">Missed: CA12 (allowlist edited)</text>

  <!-- Player input -->
  <rect x="330" y="382" width="270" height="110" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="346" y="406" font-size="16" font-weight="600" fill="#4A1B0C">Player input</text>
  <text x="346" y="426" font-size="13" fill="#712B13">Move and shoot actions</text>
  <text x="346" y="450" font-size="13" fill="#A32D2D">Missed: CA13 (macro fire)</text>
  <text x="346" y="468" font-size="13" fill="#A32D2D">Missed: CA14 (speed-limit riding)</text>
  <text x="346" y="486" font-size="13" fill="#0F6E56">Correctly passed: CL01 (human firing)</text>

  <!-- Verdict -->
  <rect x="680" y="112" width="230" height="110" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="795" y="140" font-size="16" font-weight="600" fill="#2C2C2A" text-anchor="middle">Verdict</text>
  <text x="795" y="166" font-size="13" fill="#0F6E56" text-anchor="middle">Attacks caught: 6 of 14</text>
  <text x="795" y="186" font-size="13" fill="#A32D2D" text-anchor="middle">Attacks missed: 8 of 14</text>
  <text x="795" y="206" font-size="13" fill="#854F0B" text-anchor="middle">Legit flagged: 2 of 4</text>

  <!-- Detector -->
  <rect x="680" y="262" width="230" height="80" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="795" y="290" font-size="16" font-weight="600" fill="#2C2C2A" text-anchor="middle">Detector</text>
  <text x="795" y="312" font-size="13" fill="#5F5E5A" text-anchor="middle">Flag = guard alert</text>
  <text x="795" y="330" font-size="13" fill="#5F5E5A" text-anchor="middle">or server rejection</text>

  <!-- Game server -->
  <rect x="680" y="382" width="230" height="110" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="795" y="410" font-size="16" font-weight="600" fill="#2C2C2A" text-anchor="middle">Game server</text>
  <text x="795" y="432" font-size="13" fill="#5F5E5A" text-anchor="middle">Speed limit + fire cooldown,</text>
  <text x="795" y="450" font-size="13" fill="#5F5E5A" text-anchor="middle">server-owned clock</text>
  <text x="795" y="476" font-size="13" fill="#A32D2D" text-anchor="middle">Rejected: 0 of 14 attacks</text>

  <!-- Arrows -->
  <line x1="185" y1="222" x2="185" y2="258" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="465" y1="222" x2="465" y2="258" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="185" y1="382" x2="185" y2="346" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="600" y1="302" x2="676" y2="302" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="600" y1="437" x2="676" y2="437" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="795" y1="382" x2="795" y2="346" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="795" y1="262" x2="795" y2="226" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="638" y="294" font-size="11" fill="#5F5E5A" text-anchor="middle">alerts</text>
  <text x="638" y="429" font-size="11" fill="#5F5E5A" text-anchor="middle">actions</text>

  <!-- Legend -->
  <rect x="30" y="540" width="12" height="12" rx="2" fill="#FAECE7" stroke="#D85A30"/>
  <text x="48" y="551" font-size="12" fill="#444441">Attack entry point</text>
  <text x="180" y="551" font-size="12" fill="#0F6E56">Caught / correctly passed</text>
  <text x="350" y="551" font-size="12" fill="#A32D2D">Missed</text>
  <text x="410" y="551" font-size="12" fill="#854F0B">False positive (legit flagged)</text>
  <text x="30" y="576" font-size="12" fill="#5F5E5A">Toy model results from minivac/client_attacks.py; they illustrate mechanisms and are not VAC performance.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
